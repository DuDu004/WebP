<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>별 문자 출력하기</title>
</head>
<body>
    <script>
        let num = prompt("정수를 입력하세요");
        num = parseInt(num);

        if (isNaN(num)) {
            document.write("입력 오류 입니다");
        } else {
            for(let i=1; i<=num; i++) {
                document.write("*".repeat(i) + "<br>");
            }
        }
    </script>
    
</body>
</html>
