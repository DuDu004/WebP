<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큰 자리수와 낮은자리수 같은지 비교</title>
</head>
<body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr>
    <script>
        let numbers = prompt("숫자 입력");
        if (isNaN(numbers)) {
            alert("숫자를 입력하세요.");
        }
        else {
            let lowest = numbers % 10
            let highest = numbers;
            while(highest >= 10) {
                highest = Math.floor(highest / 10);
            }

            if (highest === lowest) {
                document.write(numbers + ": 같음");
            }
            else {
                document.write(numbers + ": 다름");
            }
        }
    </script>
</body>
</html>
